plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.4'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'org.asciidoctor.jvm.convert' version '3.3.2'
    id 'com.diffplug.spotless' version '6.25.0'
    // https://plugins.gradle.org/plugin/com.diffplug.spotless
    id 'jacoco'
}

group = 'com.sillim'
version = '0.0.1-SNAPSHOT'

def querydslVersion = "7.0"

java {
    sourceCompatibility = '17'
}

configurations {
    asciidoctorExt
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('snippetsDir', file("build/generated-snippets"))
}

jacoco {
    toolVersion = '0.8.11'
}

dependencies {

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // DB
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.springframework.boot:spring-boot-starter-data-neo4j'
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // QueryDSL
    implementation("io.github.openfeign.querydsl:querydsl-core:${querydslVersion}")
    implementation("io.github.openfeign.querydsl:querydsl-jpa:$querydslVersion")
    annotationProcessor("io.github.openfeign.querydsl:querydsl-apt:$querydslVersion:jpa")

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // Open Feign
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.1.1'

    // Cache
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis:3.5.4'

    // RabbitMQ
    implementation 'org.springframework.boot:spring-boot-starter-amqp'


    // GCP
    implementation "org.springframework.cloud:spring-cloud-gcp-starter:1.2.8.RELEASE"
    implementation "org.springframework.cloud:spring-cloud-gcp-storage:1.2.8.RELEASE"

    // Firebase
    implementation 'com.google.firebase:firebase-admin:9.4.3'

    // AWS
    implementation "io.awspring.cloud:spring-cloud-aws-starter-secrets-manager:3.2.1"

    // Quartz
    implementation 'org.springframework.boot:spring-boot-starter-quartz:3.4.1'

    // Bucket4J
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.15.0'
    implementation 'com.bucket4j:bucket4j_jdk17-redis:8.14.0'
    implementation 'com.bucket4j:bucket4j_jdk17-lettuce:8.15.0'

    asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'org.testcontainers:testcontainers-mysql:2.0.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.security:spring-security-test'

    // AOP
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Prometheus
    implementation 'io.micrometer:micrometer-registry-prometheus'
}

tasks.named('test') {
    outputs.dir snippetsDir

    useJUnitPlatform {
        excludeTags 'integration'
    }

    jacoco {
        enabled = true
    }

    finalizedBy jacocoTestReport
}

tasks.register('integrationTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'integration'
    }
}

tasks.named('asciidoctor') {
    inputs.dir snippetsDir
    configurations 'asciidoctorExt'
    dependsOn test
}

bootJar { // jar의 templates에 문서 복사
    dependsOn asciidoctor
    from("${asciidoctor.outputDir}") {
        into 'BOOT-INF/classes/templates'
    }
}

spotless {

    java {
        // don't need to set target, it is inferred from java
        importOrder()
        removeUnusedImports()
        cleanthat()
        googleJavaFormat().aosp().skipJavadocFormatting()
        formatAnnotations()
        indentWithTabs()
        trimTrailingWhitespace()
        endWithNewline()
    }
} // https://github.com/diffplug/spotless/tree/main/plugin-gradle#quickstart

jacocoTestReport {
    reports {
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
        xml.required = false
        xml.required = false
    }

    def QDomains = []

    for (qPattern in '**/QA'..'**/QZ') {
        QDomains.add(qPattern + '*')
    }

    afterEvaluate {
        classDirectories.setFrom(
                files(classDirectories.files.collect {
                    fileTree(dir: it, excludes: [
                            '*.dto.*',
                            '*.util.LoggingUtils',
                            '*.*Config',
                            '*.DefaultUserService',
                            '*.QuerydslRepositorySupport',
                    ] + QDomains)
                })
        )
    }
    finalizedBy jacocoTestCoverageVerification
}

jacocoTestCoverageVerification {

    def QDomains = []

    for (qPattern in '*.QA'..'*.QZ') {
        QDomains.add(qPattern + '*')
    }

    violationRules {
        rule {
            enabled = true
            element = 'CLASS'

            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.5
            }

            excludes = [
                    '*.dto.*',
                    '*.util.LoggingUtils',
                    '*.*Config',
                    '*.DefaultUserService',
                    '*.QuerydslRepositorySupport',
            ] + QDomains
        }
    }
}

// Querydsl Settings
def querydslDir = layout.buildDirectory.dir("/generated/querydsl")

sourceSets {
    main.java.srcDirs += [querydslDir]
}

tasks.withType(JavaCompile) {
    options.generatedSourceOutputDirectory.file(querydslDir)
}

clean.doLast {
    file(querydslDir).deleteDir()
}
